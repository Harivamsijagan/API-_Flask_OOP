[project]
name = "flaskproj"
version = "0.1.0"
description = "Flask project"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-jwt-extended>=4.7.4",
    "requests>=2.34.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "src.flaskproj.students:app"
